name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

# A force-push or a second commit makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the version the project is developed against and the pinned
  # `@types/bun`; CI should not silently move ahead of either.
  BUN_VERSION: 1.3.14

jobs:
  # Everything that needs neither a Rust toolchain nor a browser, so a broken
  # type or a failing unit test is red in well under a minute rather than
  # behind a wasm compile.
  checks:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The contributor smoke test from CONTRIBUTING.md, asserted rather than
      # trusted: this job never builds the wasm, so a `typecheck` that needs
      # `wasm/diff-wasm/pkg/` fails here.
      - run: bun run typecheck

      - run: bun run lint

      - run: bun run format

      - run: bun run test

      # The README's health badge is a committed SVG, so it can go stale
      # silently — unless something notices. This is that something, and it is
      # the same contract `check:wasm-types` holds for the wasm declaration.
      # When it fails: `bun run badge`, and commit the result.
      - run: bun run check:badge

  # The engine's own tests and its formatting. Separate from `end-to-end`
  # below, which is where they used to live: they need a Rust toolchain but no
  # browser and no wasm build, so behind those they were minutes late telling
  # anyone a diff had changed shape. Warm, this job is well under a minute.
  rust:
    name: rustfmt, engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm/diff-wasm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/diff-wasm

      # Before the tests: `cargo fmt --check` needs no compile at all, so a
      # formatting failure is reported in seconds rather than after the crate
      # and its dependency tree have been built. `--all` covers the crate's
      # `examples/` and `tests/` as well as `src/`.
      #
      # When this fails: `cd wasm/diff-wasm && cargo fmt --all`, and commit.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # The unit tests over the engine: extraction, path normalisation, the
      # URL builders, rename detection, the tree's statuses and counts, and
      # the serialised shape TypeScript reads. They compile for the host
      # rather than for `wasm32`, so they are neither `bun run test` nor
      # anything the e2e suite exercises. `examples/bench.rs` carries its own
      # tests too (`test = true` in `Cargo.toml`), which is why this is not
      # `--lib`.
      - name: cargo test
        run: cargo test

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    # Downloading and diffing real archives from four registries is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Without this every run recompiles the crate and its dependency tree from
      # scratch, which is minutes; warm, `build:wasm` is about a second.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/diff-wasm

      - run: bun run build:wasm

      # `tsc` reads the checked-in declaration and Vite reads the generated
      # `pkg/`, so this is the only place the two can be compared. It needs
      # `build:wasm` above, which is why it cannot live in the pre-commit hook.
      - run: bun run check:wasm-types

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # `test:e2e` builds and serves the app itself — see the `webServer` block
      # in playwright.config.ts. It is a production build, not `vite dev`.
      - run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # PR-scoped fallow gate: only findings the PR itself introduces can fail
  # this job (Decision 2 on #111 — `--gate new-only`, the fallow default).
  # A legacy backlog on files the PR does not touch does not block it; that
  # drift is caught separately by fallow-full below.
  fallow-audit:
    name: fallow audit (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          # `audit` diffs against the PR base, which needs history beyond the
          # single commit a shallow checkout gives it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          gate: new-only

      # Phase 7 on #111. `fallow security` is an opt-in surface: its findings
      # never appear under bare `fallow` or in the audit gate above, so without
      # this step a PR could add a new `dangerouslySetInnerHTML` or a new
      # unconstrained fetch and nothing would say so.
      #
      # `--gate newly-reachable`, not `--gate new`. Both fail only on something
      # the PR brings; the difference is what counts as new. `new` fires on any
      # candidate appearing on a changed line, which includes an existing sink
      # whose *ranking* moved — and that is not hypothetical. Adding
      # `tests/unit/registries/outboundOrigins.test.ts`, whose entire purpose is
      # to prove the two `http.ts` SSRF sinks safe, raised them from `low` to
      # `medium`: fallow's taint model reads a spec full of hostile-looking URLs
      # as a module receiving untrusted input and traces it two import hops into
      # the sink. `--gate new` went red on the file that closed the finding.
      #
      # `newly-reachable` asks the question that survives that: did a candidate
      # become runtime-reachable from an entry point in head that was not
      # reachable in base? A genuinely new sink does — verified with a probe
      # `dangerouslySetInnerHTML` in `NotFound.tsx`, which fails this step — and
      # a re-ranked existing one does not.
      #
      # The standing eight are triaged in `docs/security-candidates.md` and
      # deliberately do not block; fallow has no `--gate all` here, on the
      # grounds that gating a whole backlog is how a gate gets ignored. When
      # this step fails, either fix the sink or add a row to that file.
      #
      # The base SHA rather than `origin/<base_ref>`: `fetch-depth: 0` above
      # guarantees the commit is in history, which is all `--changed-since`
      # needs, and it does not depend on how checkout arranged its remote refs.
      - name: fallow security (newly reachable candidates)
        run: >
          bunx fallow security
          --gate newly-reachable
          --changed-since ${{ github.event.pull_request.base.sha }}

      - uses: fallow-rs/fallow@v3
        if: ${{ !cancelled() }}
        with:
          format: sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: fallow-results.sarif

  # Full-repo run on `development`, separate from the PR gate above.
  # `--gate new-only` by design never looks at files a PR does not touch, so
  # this is what catches drift that lands any other way (a direct push, a
  # merge from a branch that skipped its own gate, config changes).
  fallow-full:
    name: fallow (full repo)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - uses: fallow-rs/fallow@v3

      # Phase 7 on #111: the optional TypeScript semantic pass, here and
      # nowhere else. It is what settles a dead-code candidate that the
      # syntactic pass can only guess at — whether an export really has no
      # consumers — so it has work to do exactly when the tree is not clean;
      # on a clean tree it reports `executed: false` and costs nothing.
      #
      # CI only, never the pre-commit hook: the hook's whole argument is that
      # it stays under about five seconds, and this is a second TypeScript
      # program load. `best-effort` (set in `.fallowrc.jsonc`) keeps an
      # incomplete semantic answer advisory rather than failing the job — the
      # companion is an optional dependency of `fallow`, and a runner that
      # resolves it differently should not turn CI red.
      #
      # `_meta.type_aware` goes to the job summary because "inspect the meta
      # block" is otherwise a thing nobody does. It says whether the pass ran,
      # what it adjudicated, and why it abstained where it did.
      - name: fallow dead-code (type-aware)
        run: |
          # The summary is written either way: a red step is the most
          # interesting time to be able to read why the pass abstained.
          set +e
          bunx fallow dead-code --type-aware --format json --quiet > type-aware.json
          status=$?
          set -e
          {
            echo '## fallow type-aware'
            echo '```json'
            jq '._meta.type_aware' type-aware.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The same grade the README badge carries, rendered on the run page with
      # the per-threshold detail behind it. The badge is the number; this is
      # why the number is what it is.
      - name: Publish the health grade
        if: ${{ !cancelled() }}
        run: bunx fallow health --format github-summary >> "$GITHUB_STEP_SUMMARY"

      - uses: fallow-rs/fallow@v3
        if: ${{ !cancelled() }}
        with:
          format: sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: fallow-results.sarif

      # Published as a run artifact rather than committed back to
      # `development`. `development` has required status checks, and a push
      # from this job is rejected by them (`GH006: Protected branch update
      # failed — 2 of 2 required status checks are expected`): the bot's
      # commit is brand new, so its checks have not run. They also never
      # would — a push authenticated with `GITHUB_TOKEN` does not trigger
      # workflows, so the commit could not become mergeable on its own. The
      # baselines are downloaded from the run and committed through a normal
      # PR when they need refreshing; see CONTRIBUTING.md.
      - name: Save per-analysis baselines
        run: |
          bunx fallow dead-code --format json --quiet --save-baseline dead-code-baseline.json
          bunx fallow health --format json --quiet --save-baseline health-baseline.json
          bunx fallow dupes --format json --quiet --save-baseline dupes-baseline.json

      - name: Upload per-analysis baselines
        uses: actions/upload-artifact@v6
        with:
          name: fallow-baselines
          path: |
            dead-code-baseline.json
            health-baseline.json
            dupes-baseline.json
          retention-days: 30
